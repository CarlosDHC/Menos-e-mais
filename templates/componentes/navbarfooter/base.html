<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Menos é Mais</title>
    
    <!-- Importando o CSS Global -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    
    <!-- Espaço para CSS específico de cada página -->
    {% block styles %}{% endblock %}
</head>
<body>
    <!-- ================= NAVBAR ================= -->
    {% block navbar %}
    <header class="navbar">
        <nav class="navBar">
            <img src="{{ url_for('static', filename='img/navBar/logo.png') }}" alt="Logo" class="imgLogo" />
            
            <ul class="nav_list">
                <li class="nav_list-item">
                    <a href="{{ url_for('missoes') }}" class="nav_list-link">Missões</a>
                </li>
                <li class="nav_list-item">
                    <a href="{{ url_for('conquistas') }}" class="nav_list-link">Conquistas</a>
                </li>
            </ul>

            <a href="{{ url_for('login') }}" class="link_perfil">
                <i class="fa-solid fa-circle-user icon"></i>
            </a>
        </nav>
    </header>
    {% endblock %}

    <!-- ================= CONTEÚDO DINÂMICO ================= -->
    <main>
        {% block content %}
        <!-- O conteúdo das páginas será injetado aqui -->
        {% endblock %}
    </main>

    <!-- ================= FOOTER ================= -->
    <section class="footer">
        <span>Feito por Faculdade ENIAC &copy; 2026 </span>
    </section>
</body>
</html>
